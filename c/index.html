<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-itunes-app" content="app-id=6818746570">
<title>Captain Patch: a challenge</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: "Trebuchet MS", system-ui, sans-serif; color: #2a1a3e;
         background: linear-gradient(#6fd3f7, #238bd6); }
  .card { background: #fff4d6; border: 6px solid #2a1a3e; border-radius: 32px; padding: 28px 24px; margin: 16px;
          max-width: 420px; text-align: center; box-shadow: 0 10px 0 rgba(42, 26, 62, 0.35); }
  h1 { font-size: 30px; margin: 0 0 8px; }
  p { font-size: 19px; line-height: 1.4; margin: 10px 0 22px; }
  a.btn { display: block; margin: 12px 0; padding: 16px; border-radius: 22px; font-size: 20px; font-weight: bold;
          text-decoration: none; color: #fff; border: 4px solid #2a1a3e; }
  .store { background: #2f8cff; }  .web { background: #ff8a1f; }
  .cat { font-size: 64px; }
</style>
</head>
<body>
<div class="card">
  <div class="cat">🐱🏴‍☠️</div>
  <h1 id="h">A friend dares you!</h1>
  <p id="p">Your friend solved an island in Captain Patch. Can you beat the time?</p>
  <a class="btn store" id="s" href="https://apps.apple.com/app/id6818746570">Get it on the App Store</a>
  <a class="btn web" id="w" href="https://nomadsmoker.itch.io/captain-patch">Play in the browser</a>
</div>
<script>
// the challenge: ?i=<island>&t=<seconds>&s=<stars>, or ?d=<daily island number>&t=<seconds>
var q = new URLSearchParams(location.search), t = parseInt(q.get('t') || '0', 10);
var time = t > 0 ? Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2) : '';
var L = {
  en: ['A friend dares you!', 'Your friend solved %n in %t. Can you beat that, Captain?', 'Get it on the App Store', 'Play in the browser', 'today\'s Daily Island', 'island %d'],
  de: ['Eine Herausforderung!', 'Dein Freund hat %n in %t gelöst. Schaffst du das schneller, Käpt\'n?', 'Im App Store laden', 'Im Browser spielen', 'die Tages-Insel', 'Insel %d'],
  es: ['¡Un reto!', 'Tu amigo resolvió %n en %t. ¿Lo superas, capitán?', 'Descárgalo en el App Store', 'Jugar en el navegador', 'la Isla del día', 'la isla %d'],
  fr: ['Un défi !', 'Ton ami a résolu %n en %t. Tu fais mieux, capitaine ?', 'Télécharger sur l\'App Store', 'Jouer dans le navigateur', 'l\'île du jour', 'l\'île %d'],
  it: ['Una sfida!', 'Il tuo amico ha risolto %n in %t. Fai di meglio, capitano?', 'Scarica dall\'App Store', 'Gioca nel browser', 'l\'Isola del giorno', 'l\'isola %d'],
  pt: ['Um desafio!', 'Seu amigo resolveu %n em %t. Consegue bater, capitão?', 'Baixar na App Store', 'Jogar no navegador', 'a Ilha do dia', 'a ilha %d'],
  nl: ['Een uitdaging!', 'Je vriend loste %n op in %t. Kun jij dat sneller, kapitein?', 'Download in de App Store', 'Speel in de browser', 'het Dageiland', 'eiland %d'],
  pl: ['Wyzwanie!', 'Twój znajomy rozwiązał %n w %t. Pobijesz to, kapitanie?', 'Pobierz z App Store', 'Graj w przeglądarce', 'Wyspę dnia', 'wyspę %d'],
  tr: ['Bir meydan okuma!', 'Arkadaşın %n %t sürede çözdü. Daha hızlı olabilir misin, kaptan?', 'App Store\'dan indir', 'Tarayıcıda oyna', 'Günün Adası\'nı', '%d. adayı'],
  ja: ['挑戦状だ！', '友だちが%nを%tでクリア。キミはもっと速く解ける？', 'App Storeで入手', 'ブラウザで遊ぶ', '今日の島', '島%d'],
  ko: ['도전장이 왔어요!', '친구가 %n을 %t 만에 풀었어요. 더 빨리 풀 수 있나요?', 'App Store에서 받기', '브라우저에서 플레이', '오늘의 섬', '%d번 섬']
};
var lang = (navigator.language || 'en').slice(0, 2).toLowerCase(), T = L[lang] || L.en;
document.documentElement.lang = L[lang] ? lang : 'en';
var n = q.get('i') ? T[5].replace('%d', parseInt(q.get('i'), 10)) : T[4];
document.getElementById('h').textContent = T[0];
if (time) document.getElementById('p').textContent = T[1].replace('%n', n).replace('%t', time);
document.getElementById('s').textContent = T[2];
document.getElementById('w').textContent = T[3];
</script>
</body>
</html>
